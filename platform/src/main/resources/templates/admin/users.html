<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Nawala Admin</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-page">
    <div th:replace="~{fragments/sidebar :: sidebar('admin')}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/header :: header('User Management', 'Manage platform users and privileges')}"></div>
        <div class="content-area">
            <div th:if="${success}" class="alert alert-success"><span th:text="${success}"></span></div>
            <div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div>
            
            <!-- Stats Row -->
            <div class="stats-row" style="margin-bottom:1.5rem">
                <div class="stat-card">
                    <div class="stat-icon stat-icon-blue">👥</div>
                    <div class="stat-content">
                        <span class="stat-value" th:text="${users.size()}">0</span>
                        <span class="stat-label">Total Users</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-icon-purple">👑</div>
                    <div class="stat-content">
                        <span class="stat-value" th:text="${#lists.size(users.?[role.name() == 'ADMIN'])}">0</span>
                        <span class="stat-label">Admins</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-icon-green">✅</div>
                    <div class="stat-content">
                        <span class="stat-value" th:text="${#lists.size(users.?[enabled == true])}">0</span>
                        <span class="stat-label">Active</span>
                    </div>
                </div>
            </div>

            <!-- Action Bar -->
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
                <h3 style="margin:0">All Users</h3>
                <button type="button" class="btn btn-primary" onclick="Nawala.Modal.open('createUserModal')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Create User
                </button>
            </div>

            <!-- Users Table -->
            <div class="card">
                <div class="card-body" style="padding:0">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Privileges</th>
                                <th>Status</th>
                                <th>Last Login</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td>
                                    <div style="display:flex;align-items:center;gap:0.75rem">
                                        <div class="avatar avatar-sm" th:text="${u.username.substring(0,1).toUpperCase()}">U</div>
                                        <div>
                                            <div th:text="${u.username}" style="font-weight:500">username</div>
                                            <div class="text-muted small">ID: <span th:text="${u.id}">1</span></div>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${u.email}">email@example.com</td>
                                <td>
                                    <span class="badge" th:classappend="${u.role.name() == 'ADMIN'} ? ' badge-purple' : (${u.role.name() == 'DEVELOPER'} ? ' badge-blue' : ' badge-muted')" th:text="${u.role}">USER</span>
                                </td>
                                <td>
                                    <div class="privilege-tags">
                                        <span class="tag tag-sm" th:if="${u.canManageRoutes}">🛣️ Routes</span>
                                        <span class="tag tag-sm" th:if="${u.canManageKeys}">🔑 Keys</span>
                                        <span class="tag tag-sm" th:if="${u.canViewAnalytics}">📊 Analytics</span>
                                        <span class="text-muted small" th:if="${!u.canManageRoutes and !u.canManageKeys and !u.canViewAnalytics}">None</span>
                                    </div>
                                </td>
                                <td>
                                    <span class="status-badge" th:classappend="${u.enabled} ? ' status-active' : ' status-inactive'">
                                        <span class="status-dot"></span>
                                        <span th:text="${u.enabled} ? 'Active' : 'Disabled'">Active</span>
                                    </span>
                                </td>
                                <td>
                                    <span th:if="${u.lastLoginAt != null}" th:text="${#temporals.format(u.lastLoginAt, 'dd MMM HH:mm')}">Never</span>
                                    <span th:unless="${u.lastLoginAt != null}" class="text-muted">Never</span>
                                </td>
                                <td>
                                    <div class="action-btns">
                                        <button type="button" class="btn-icon" title="Edit" th:onclick="'editUser(' + ${u.id} + ')'">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                        </button>
                                        <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" style="display:inline">
                                            <button type="submit" class="btn-icon" th:title="${u.enabled} ? 'Disable' : 'Enable'">
                                                <svg th:if="${u.enabled}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                                                <svg th:unless="${u.enabled}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="7" class="empty-state">No users found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>

    <!-- Create User Modal -->
    <div class="modal-backdrop" id="createUserModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Create New User</h3>
                <button type="button" class="modal-close" onclick="Nawala.Modal.close('createUserModal')">✕</button>
            </div>
            <form th:action="@{/admin/users/create}" method="post">
                <div class="modal-body">
                    <div class="input-group">
                        <label for="newUsername">Username</label>
                        <div class="input-wrapper">
                            <input type="text" id="newUsername" name="username" required placeholder="johndoe">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="newEmail">Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="newEmail" name="email" required placeholder="john@example.com">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="newPassword">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="newPassword" name="password" required minlength="8" placeholder="Min 8 characters">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="newRole">Role</label>
                        <div class="input-wrapper">
                            <select id="newRole" name="role" class="form-select">
                                <option value="USER">User - Basic access</option>
                                <option value="DEVELOPER">Developer - API management</option>
                                <option value="ADMIN">Admin - Full access</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Privileges</label>
                        <div style="display:flex;flex-direction:column;gap:0.5rem;margin-top:0.5rem">
                            <label class="checkbox-label"><input type="checkbox" name="canManageRoutes"><span>Can manage routes</span></label>
                            <label class="checkbox-label"><input type="checkbox" name="canManageKeys"><span>Can manage API keys</span></label>
                            <label class="checkbox-label"><input type="checkbox" name="canViewAnalytics"><span>Can view analytics</span></label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="Nawala.Modal.close('createUserModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create User</button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
