<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: layout(title='OAuth Clients', content=~{::content})}">
<div th:fragment="content">
    <div class="flex justify-between items-center mb-6">
        <p class="text-gray-500 dark:text-gray-400">Manage OAuth2 client applications</p>
        <button onclick="document.getElementById('oauthModal').classList.remove('hidden')" class="btn-primary inline-flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
            New Client
        </button>
    </div>

    <!-- Client Secret Alert -->
    <div th:if="${clientSecret}" class="card p-4 mb-6 bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-800">
        <div class="flex items-start gap-3">
            <svg class="w-6 h-6 text-yellow-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            <div class="flex-1">
                <p class="font-medium text-yellow-800 dark:text-yellow-200">Save your client secret now!</p>
                <p class="text-sm text-yellow-700 dark:text-yellow-300 mb-2">This secret will only be shown once.</p>
                <code class="block p-2 bg-yellow-100 dark:bg-yellow-900/30 rounded font-mono text-sm break-all" th:text="${clientSecret}">secret</code>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(clients)}" class="card p-12 text-center">
        <svg class="w-16 h-16 mx-auto text-gray-300 dark:text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">No OAuth clients</h3>
        <p class="text-gray-500 dark:text-gray-400">Create your first OAuth2 client application</p>
    </div>

    <div th:unless="${#lists.isEmpty(clients)}" class="space-y-4">
        <div th:each="client : ${clients}" class="card p-6">
            <div class="flex items-start justify-between">
                <div>
                    <h3 class="font-semibold text-gray-900 dark:text-white" th:text="${client.name}">Client</h3>
                    <p class="text-sm font-mono text-gray-500 mt-1">Client ID: <span class="text-gray-700 dark:text-gray-300" th:text="${client.clientId}">nwl_xxx</span></p>
                    <div class="flex flex-wrap gap-2 mt-3">
                        <span th:each="scope : ${#strings.arraySplit(client.scopes, ',')}" class="px-2 py-0.5 text-xs bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 rounded" th:text="${scope}">scope</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <form th:action="@{/oauth-clients/{id}/regenerate(id=${client.id})}" method="post" onsubmit="return confirm('Regenerate secret? Old secret will stop working.')">
                        <button type="submit" class="p-2 text-gray-500 hover:text-orange-600" title="Regenerate Secret">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        </button>
                    </form>
                    <form th:action="@{/oauth-clients/{id}/delete(id=${client.id})}" method="post" onsubmit="return confirm('Delete this client?')">
                        <button type="submit" class="p-2 text-gray-500 hover:text-red-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="oauthModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl max-w-md w-full p-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Create OAuth Client</h3>
            <form th:action="@{/oauth-clients/create}" method="post" class="space-y-4">
                <div>
                    <label class="label">Application Name</label>
                    <input type="text" name="name" class="input" required placeholder="My App">
                </div>
                <div>
                    <label class="label">Redirect URI</label>
                    <input type="url" name="redirectUri" class="input" placeholder="https://myapp.com/callback">
                </div>
                <div>
                    <label class="label">Scopes</label>
                    <div class="space-y-2">
                        <label class="flex items-center gap-2"><input type="checkbox" name="scopes" value="read" checked class="rounded"> <span class="text-gray-700 dark:text-gray-300">read</span></label>
                        <label class="flex items-center gap-2"><input type="checkbox" name="scopes" value="write" class="rounded"> <span class="text-gray-700 dark:text-gray-300">write</span></label>
                        <label class="flex items-center gap-2"><input type="checkbox" name="scopes" value="admin" class="rounded"> <span class="text-gray-700 dark:text-gray-300">admin</span></label>
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="document.getElementById('oauthModal').classList.add('hidden')" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>
</th:block>
</html>
