<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: layout(title='Plugins', content=~{::content})}">
<div th:fragment="content">
    <div class="flex justify-between items-center mb-6">
        <p class="text-gray-500 dark:text-gray-400">Extend gateway functionality with plugins</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Installed Plugins -->
        <div class="card">
            <div class="p-6 border-b border-gray-200 dark:border-gray-700">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Installed Plugins</h2>
            </div>
            <div th:if="${#lists.isEmpty(plugins)}" class="p-8 text-center text-gray-500">
                <p>No plugins installed</p>
            </div>
            <div th:unless="${#lists.isEmpty(plugins)}" class="divide-y divide-gray-200 dark:divide-gray-700">
                <div th:each="plugin : ${plugins}" class="p-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-purple-100 dark:bg-purple-900/30 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-purple-600 dark:text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"/></svg>
                        </div>
                        <div>
                            <p class="font-medium text-gray-900 dark:text-white" th:text="${plugin.name}">Plugin</p>
                            <p class="text-sm text-gray-500" th:text="${plugin.hookType}">pre_request</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <form th:action="@{/plugins/{id}/toggle(id=${plugin.id})}" method="post">
                            <button type="submit" th:class="'px-3 py-1 rounded-full text-xs font-medium ' + (${plugin.active} ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400')" th:text="${plugin.active} ? 'Active' : 'Disabled'">Active</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Available Plugins -->
        <div class="card">
            <div class="p-6 border-b border-gray-200 dark:border-gray-700">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Available Plugins</h2>
            </div>
            <div class="divide-y divide-gray-200 dark:divide-gray-700">
                <div class="p-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-100 dark:bg-blue-900/30 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <div>
                            <p class="font-medium text-gray-900 dark:text-white">Request Validator</p>
                            <p class="text-sm text-gray-500">Validate JSON schema</p>
                        </div>
                    </div>
                    <button class="btn-secondary text-sm">Install</button>
                </div>
                <div class="p-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-orange-100 dark:bg-orange-900/30 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <div>
                            <p class="font-medium text-gray-900 dark:text-white">Response Cache</p>
                            <p class="text-sm text-gray-500">Cache GET responses</p>
                        </div>
                    </div>
                    <button class="btn-secondary text-sm">Install</button>
                </div>
                <div class="p-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-green-100 dark:bg-green-900/30 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        </div>
                        <div>
                            <p class="font-medium text-gray-900 dark:text-white">Request Transformer</p>
                            <p class="text-sm text-gray-500">Modify headers/body</p>
                        </div>
                    </div>
                    <button class="btn-secondary text-sm">Install</button>
                </div>
            </div>
        </div>
    </div>
</div>
</th:block>
</html>
