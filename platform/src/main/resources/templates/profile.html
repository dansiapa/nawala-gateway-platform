<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: layout(title='Profile', content=~{::content})}">
<div th:fragment="content">
    <div class="max-w-2xl">
        <!-- Profile Card -->
        <div class="card p-6 mb-6">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-green-500 flex items-center justify-center">
                    <span class="text-white text-2xl font-bold" th:text="${currentUser?.username?.substring(0,1)?.toUpperCase()}">U</span>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-gray-900 dark:text-white" th:text="${currentUser?.username}">Username</h2>
                    <p class="text-gray-500 dark:text-gray-400" th:text="${currentUser?.email}">email@example.com</p>
                    <span class="inline-block mt-1 px-2 py-0.5 text-xs font-medium bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 rounded" th:text="${currentUser?.role}">ROLE</span>
                </div>
            </div>
        </div>

        <!-- Theme Settings -->
        <div class="card p-6 mb-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Theme Preference</h3>
            <form th:action="@{/profile/theme}" method="post" class="space-y-3">
                <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700/50">
                    <input type="radio" name="theme" value="light" th:checked="${currentUser?.themePreference == 'light'}" class="w-4 h-4 text-blue-600">
                    <svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <span class="text-gray-900 dark:text-white">Light</span>
                </label>
                <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700/50">
                    <input type="radio" name="theme" value="dark" th:checked="${currentUser?.themePreference == 'dark'}" class="w-4 h-4 text-blue-600">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                    <span class="text-gray-900 dark:text-white">Dark</span>
                </label>
                <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700/50">
                    <input type="radio" name="theme" value="system" th:checked="${currentUser?.themePreference == 'system' or currentUser?.themePreference == null}" class="w-4 h-4 text-blue-600">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    <span class="text-gray-900 dark:text-white">System</span>
                </label>
                <button type="submit" class="btn-primary mt-4">Save Preference</button>
            </form>
        </div>

        <!-- Change Password -->
        <div class="card p-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Change Password</h3>
            <form th:action="@{/profile/password}" method="post" class="space-y-4">
                <div>
                    <label class="label">Current Password</label>
                    <input type="password" name="currentPassword" class="input" required>
                </div>
                <div>
                    <label class="label">New Password</label>
                    <input type="password" name="newPassword" class="input" required minlength="8">
                </div>
                <div>
                    <label class="label">Confirm New Password</label>
                    <input type="password" name="confirmPassword" class="input" required>
                </div>
                <button type="submit" class="btn-primary">Update Password</button>
            </form>
        </div>
    </div>
</div>
</th:block>
</html>
