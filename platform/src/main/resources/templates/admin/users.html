<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: layout(title='User Management', content=~{::content})}">
<div th:fragment="content">
    <div class="flex justify-between items-center mb-6">
        <p class="text-gray-500 dark:text-gray-400">Manage platform users and their permissions</p>
        <button onclick="document.getElementById('newUserModal').classList.remove('hidden')" class="btn-primary inline-flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
            Add User
        </button>
    </div>

    <!-- Users Table -->
    <div class="card overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 dark:bg-gray-700/50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">User</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Role</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Created</th>
                    <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                <tr th:each="user : ${users}" class="hover:bg-gray-50 dark:hover:bg-gray-700/30">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center">
                                <span class="text-white font-medium" th:text="${user.username.substring(0,1).toUpperCase()}">U</span>
                            </div>
                            <div>
                                <p class="font-medium text-gray-900 dark:text-white" th:text="${user.username}">username</p>
                                <p class="text-sm text-gray-500 dark:text-gray-400" th:text="${user.email}">email</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span th:class="'px-2 py-1 text-xs font-medium rounded ' + (${user.role.name() == 'ADMIN'} ? 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400' : 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400')" th:text="${user.role}">ROLE</span>
                    </td>
                    <td class="px-6 py-4">
                        <span th:if="${user.enabled}" class="inline-flex items-center gap-1 text-green-600 dark:text-green-400"><span class="w-2 h-2 bg-green-500 rounded-full"></span> Active</span>
                        <span th:unless="${user.enabled}" class="inline-flex items-center gap-1 text-gray-500"><span class="w-2 h-2 bg-gray-400 rounded-full"></span> Disabled</span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500 dark:text-gray-400" th:text="${#temporals.format(user.createdAt, 'MMM d, yyyy')}">Jan 1, 2024</td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="p-2 text-gray-500 hover:text-blue-600" title="Edit">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </a>
                            <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post" class="inline">
                                <button type="submit" class="p-2 text-gray-500 hover:text-orange-600" title="Toggle Status">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- New User Modal -->
    <div id="newUserModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl max-w-md w-full p-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Add New User</h3>
            <form th:action="@{/admin/users/create}" method="post" class="space-y-4">
                <div>
                    <label class="label">Username</label>
                    <input type="text" name="username" class="input" required>
                </div>
                <div>
                    <label class="label">Email</label>
                    <input type="email" name="email" class="input" required>
                </div>
                <div>
                    <label class="label">Password</label>
                    <input type="password" name="password" class="input" required minlength="8">
                </div>
                <div>
                    <label class="label">Role</label>
                    <select name="role" class="input">
                        <option value="USER">User</option>
                        <option value="DEVELOPER">Developer</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="document.getElementById('newUserModal').classList.add('hidden')" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Create User</button>
                </div>
            </form>
        </div>
    </div>
</div>
</th:block>
</html>
