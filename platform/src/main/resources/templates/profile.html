<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Nawala</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-page">
    <div th:replace="~{fragments/sidebar :: sidebar('profile')}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/header :: header('My Profile', 'Manage your account settings')}"></div>
        <div class="content-area">
            <div th:if="${success}" class="alert alert-success"><span th:text="${success}"></span></div>
            <div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div>
            
            <div class="profile-layout">
                <!-- Profile Card -->
                <div class="card profile-card">
                    <div class="profile-header">
                        <div class="profile-avatar" th:text="${user.username.substring(0,1).toUpperCase()}">U</div>
                        <h2 th:text="${user.username}">Username</h2>
                        <span class="badge" th:classappend="${user.role.name() == 'ADMIN'} ? ' badge-purple' : ' badge-blue'" th:text="${user.role}">USER</span>
                    </div>
                    <div class="profile-stats">
                        <div class="profile-stat">
                            <span class="profile-stat-value" th:text="${user.routeCount != null} ? ${user.routeCount} : '0'">0</span>
                            <span class="profile-stat-label">Routes</span>
                        </div>
                        <div class="profile-stat">
                            <span class="profile-stat-value" th:text="${user.apiKeyCount != null} ? ${user.apiKeyCount} : '0'">0</span>
                            <span class="profile-stat-label">API Keys</span>
                        </div>
                        <div class="profile-stat">
                            <span class="profile-stat-value" th:text="${user.totalRequests != null} ? ${user.totalRequests} : '0'">0</span>
                            <span class="profile-stat-label">Requests</span>
                        </div>
                    </div>
                    <div class="profile-info">
                        <div class="info-row">
                            <span class="info-label">📧 Email</span>
                            <span class="info-value" th:text="${user.email}">email@example.com</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">📅 Joined</span>
                            <span class="info-value" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">Date</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">🕒 Last Login</span>
                            <span class="info-value" th:text="${user.lastLoginAt != null} ? ${#temporals.format(user.lastLoginAt, 'dd MMM yyyy HH:mm')} : 'First session'">Never</span>
                        </div>
                    </div>
                </div>

                <!-- Settings Forms -->
                <div class="profile-forms">
                    <!-- Update Profile -->
                    <div class="card">
                        <div class="card-header"><h3>👤 Update Profile</h3></div>
                        <div class="card-body">
                            <form th:action="@{/profile/update}" method="post">
                                <div class="input-group">
                                    <label for="email">Email Address</label>
                                    <div class="input-wrapper">
                                        <input type="email" id="email" name="email" th:value="${user.email}" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </form>
                        </div>
                    </div>

                    <!-- Change Password -->
                    <div class="card">
                        <div class="card-header"><h3>🔒 Change Password</h3></div>
                        <div class="card-body">
                            <form th:action="@{/profile/password}" method="post">
                                <div class="input-group">
                                    <label for="currentPassword">Current Password</label>
                                    <div class="input-wrapper">
                                        <input type="password" id="currentPassword" name="currentPassword" required>
                                        <button type="button" class="toggle-password">👁</button>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label for="newPassword">New Password</label>
                                    <div class="input-wrapper">
                                        <input type="password" id="newPassword" name="newPassword" required minlength="8">
                                        <button type="button" class="toggle-password">👁</button>
                                    </div>
                                    <span class="field-hint">Minimum 8 characters</span>
                                </div>
                                <div class="input-group">
                                    <label for="confirmPassword">Confirm Password</label>
                                    <div class="input-wrapper">
                                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">Update Password</button>
                            </form>
                        </div>
                    </div>

                    <!-- Theme Preference -->
                    <div class="card">
                        <div class="card-header"><h3>🎨 Appearance</h3></div>
                        <div class="card-body">
                            <div class="input-group">
                                <label>Theme Preference</label>
                                <div class="theme-selector">
                                    <button type="button" class="theme-option theme-btn" data-theme="light">
                                        <span class="theme-icon">☀️</span>
                                        <span>Light</span>
                                    </button>
                                    <button type="button" class="theme-option theme-btn" data-theme="dark">
                                        <span class="theme-icon">🌙</span>
                                        <span>Dark</span>
                                    </button>
                                    <button type="button" class="theme-option theme-btn" data-theme="system">
                                        <span class="theme-icon">💻</span>
                                        <span>System</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
