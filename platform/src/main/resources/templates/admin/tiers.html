<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Tiers - Nawala Admin</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-page">
    <div th:replace="~{fragments/sidebar :: sidebar('admin')}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/header :: header('Service Tiers', 'Configure rate limits and quotas for different tiers')}"></div>
        <div class="content-area">
            <div th:if="${success}" class="alert alert-success"><span th:text="${success}"></span></div>
            
            <div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
                <button type="button" class="btn btn-primary" onclick="Nawala.Modal.open('createTierModal')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    New Tier
                </button>
            </div>

            <!-- Tier Cards -->
            <div class="tier-grid">
                <div class="tier-card" th:each="tier : ${tiers}" th:classappend="${tier.isDefault} ? ' tier-default' : ''">
                    <div class="tier-header">
                        <h3 th:text="${tier.name}">Tier Name</h3>
                        <span class="badge badge-blue" th:if="${tier.isDefault}">Default</span>
                    </div>
                    <div class="tier-limits">
                        <div class="tier-limit">
                            <span class="limit-value" th:text="${tier.requestsPerMinute}">100</span>
                            <span class="limit-label">req/min</span>
                        </div>
                        <div class="tier-limit">
                            <span class="limit-value" th:text="${tier.requestsPerDay == 0} ? '∞' : ${tier.requestsPerDay}">10000</span>
                            <span class="limit-label">req/day</span>
                        </div>
                        <div class="tier-limit">
                            <span class="limit-value" th:text="${tier.maxPayloadKb}">1024</span>
                            <span class="limit-label">KB max</span>
                        </div>
                    </div>
                    <div class="tier-features">
                        <div class="tier-feature" th:if="${tier.analyticsAccess}">✅ Analytics Access</div>
                        <div class="tier-feature" th:if="${tier.webhooksEnabled}">✅ Webhooks</div>
                        <div class="tier-feature" th:if="${tier.prioritySupport}">✅ Priority Support</div>
                    </div>
                    <div class="tier-footer">
                        <span class="tier-users" th:text="${tier.userCount} + ' users'">0 users</span>
                        <div class="action-btns">
                            <button type="button" class="btn-sm btn-secondary">Edit</button>
                            <form th:unless="${tier.isDefault}" th:action="@{/admin/tiers/{id}/delete(id=${tier.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete tier?')">
                                <button type="submit" class="btn-sm btn-danger-sm">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>

    <!-- Create Tier Modal -->
    <div class="modal-backdrop" id="createTierModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Create Service Tier</h3>
                <button type="button" class="modal-close" onclick="Nawala.Modal.close('createTierModal')">✕</button>
            </div>
            <form th:action="@{/admin/tiers/create}" method="post">
                <div class="modal-body">
                    <div class="input-group">
                        <label>Tier Name</label>
                        <div class="input-wrapper"><input type="text" name="name" required placeholder="Premium"></div>
                    </div>
                    <div class="form-grid-2">
                        <div class="input-group">
                            <label>Requests/Minute</label>
                            <div class="input-wrapper"><input type="number" name="requestsPerMinute" value="100" min="1"></div>
                        </div>
                        <div class="input-group">
                            <label>Requests/Day (0=unlimited)</label>
                            <div class="input-wrapper"><input type="number" name="requestsPerDay" value="0" min="0"></div>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Max Payload Size (KB)</label>
                        <div class="input-wrapper"><input type="number" name="maxPayloadKb" value="1024" min="1"></div>
                    </div>
                    <div class="input-group">
                        <label>Features</label>
                        <div style="display:flex;flex-direction:column;gap:0.5rem;margin-top:0.5rem">
                            <label class="checkbox-label"><input type="checkbox" name="analyticsAccess"><span>Analytics Access</span></label>
                            <label class="checkbox-label"><input type="checkbox" name="webhooksEnabled"><span>Webhooks Enabled</span></label>
                            <label class="checkbox-label"><input type="checkbox" name="prioritySupport"><span>Priority Support</span></label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="Nawala.Modal.close('createTierModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Tier</button>
                </div>
            </form>
        </div>
    </div>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
