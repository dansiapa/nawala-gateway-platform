<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: layout(title='WAF & Security', content=~{::content})}">
<div th:fragment="content">
    <!-- Status Banner -->
    <div th:classappend="${wafEnabled} ? 'bg-green-50 dark:bg-green-900/20 border-green-200 dark:border-green-800' : 'bg-yellow-50 dark:bg-yellow-900/20 border-yellow-200 dark:border-yellow-800'" class="card p-4 mb-6 border flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div th:classappend="${wafEnabled} ? 'bg-green-500' : 'bg-yellow-500'" class="w-3 h-3 rounded-full"></div>
            <span th:classappend="${wafEnabled} ? 'text-green-800 dark:text-green-200' : 'text-yellow-800 dark:text-yellow-200'" class="font-medium" th:text="${wafEnabled} ? 'WAF Protection Active' : 'WAF Partially Enabled'">Status</span>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Protection Features -->
        <div class="lg:col-span-2 space-y-6">
            <div class="card p-6">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Protection Features</h2>
                <div class="space-y-3">
                    <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                        <div class="flex items-center gap-3">
                            <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                            <div>
                                <p class="font-medium text-gray-900 dark:text-white">SQL Injection Protection</p>
                                <p class="text-sm text-gray-500">Blocks malicious SQL queries</p>
                            </div>
                        </div>
                        <form th:action="@{/waf/toggle}" method="post">
                            <input type="hidden" name="feature" value="sql_injection">
                            <input type="hidden" name="enabled" value="true">
                            <button type="submit" class="px-3 py-1 bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 rounded-full text-sm font-medium">Enabled</button>
                        </form>
                    </div>
                    <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                        <div class="flex items-center gap-3">
                            <svg class="w-6 h-6 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                            <div>
                                <p class="font-medium text-gray-900 dark:text-white">XSS Protection</p>
                                <p class="text-sm text-gray-500">Blocks cross-site scripting</p>
                            </div>
                        </div>
                        <form th:action="@{/waf/toggle}" method="post">
                            <input type="hidden" name="feature" value="xss">
                            <input type="hidden" name="enabled" value="true">
                            <button type="submit" class="px-3 py-1 bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 rounded-full text-sm font-medium">Enabled</button>
                        </form>
                    </div>
                    <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                        <div class="flex items-center gap-3">
                            <svg class="w-6 h-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                            <div>
                                <p class="font-medium text-gray-900 dark:text-white">Path Traversal Protection</p>
                                <p class="text-sm text-gray-500">Blocks directory traversal attacks</p>
                            </div>
                        </div>
                        <form th:action="@{/waf/toggle}" method="post">
                            <input type="hidden" name="feature" value="path_traversal">
                            <input type="hidden" name="enabled" value="true">
                            <button type="submit" class="px-3 py-1 bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 rounded-full text-sm font-medium">Enabled</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Custom Rules -->
            <div class="card p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Custom Rules</h2>
                    <button class="btn-secondary text-sm">Add Rule</button>
                </div>
                <div th:if="${#lists.isEmpty(rules)}" class="text-center py-8 text-gray-500">
                    <p>No custom rules configured</p>
                </div>
                <div th:unless="${#lists.isEmpty(rules)}" class="space-y-2">
                    <div th:each="rule : ${rules}" class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                        <div>
                            <p class="font-medium text-gray-900 dark:text-white" th:text="${rule.name}">Rule</p>
                            <p class="text-sm text-gray-500" th:text="${rule.ruleType + ' - ' + rule.action}">Type</p>
                        </div>
                        <span th:classappend="${rule.active} ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'" class="px-2 py-1 rounded text-xs" th:text="${rule.active} ? 'Active' : 'Disabled'">Status</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Blocked IPs -->
        <div class="card p-6 h-fit">
            <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Blocked IPs</h2>
            <form th:action="@{/waf/block-ip}" method="post" class="mb-4">
                <div class="flex gap-2">
                    <input type="text" name="ip" class="input flex-1" placeholder="192.168.1.1" pattern="^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$">
                    <button type="submit" class="btn-primary">Block</button>
                </div>
            </form>
            <div th:if="${#sets.isEmpty(blockedIps)}" class="text-center py-4 text-gray-500 text-sm">
                <p>No blocked IPs</p>
            </div>
            <div th:unless="${#sets.isEmpty(blockedIps)}" class="space-y-2">
                <div th:each="ip : ${blockedIps}" class="flex items-center justify-between p-2 bg-red-50 dark:bg-red-900/20 rounded">
                    <code class="text-sm text-red-700 dark:text-red-300" th:text="${ip}">IP</code>
                    <form th:action="@{/waf/unblock-ip}" method="post">
                        <input type="hidden" name="ip" th:value="${ip}">
                        <button type="submit" class="text-red-500 hover:text-red-700 text-sm">Unblock</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</th:block>
</html>
