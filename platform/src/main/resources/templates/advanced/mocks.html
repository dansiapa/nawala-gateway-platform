<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: layout(title='API Mocks', content=~{::content})}">
<div th:fragment="content">
    <div class="flex justify-between items-center mb-6">
        <p class="text-gray-500 dark:text-gray-400">Create mock endpoints for testing</p>
        <button onclick="document.getElementById('mockModal').classList.remove('hidden')" class="btn-primary inline-flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
            New Mock
        </button>
    </div>

    <div th:if="${#lists.isEmpty(mocks)}" class="card p-12 text-center">
        <svg class="w-16 h-16 mx-auto text-gray-300 dark:text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
        <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">No mock endpoints</h3>
        <p class="text-gray-500 dark:text-gray-400">Create mock APIs for testing and development</p>
    </div>

    <div th:unless="${#lists.isEmpty(mocks)}" class="card overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 dark:bg-gray-700/50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Endpoint</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Response</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Status</th>
                    <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                <tr th:each="mock : ${mocks}" class="hover:bg-gray-50 dark:hover:bg-gray-700/30">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <span th:class="'px-2 py-0.5 text-xs font-bold rounded ' + (${mock.method == 'GET'} ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700')" th:text="${mock.method}">GET</span>
                            <span class="font-mono text-sm text-gray-700 dark:text-gray-300" th:text="${mock.path}">/mock/test</span>
                        </div>
                        <p class="text-sm text-gray-500 mt-1" th:text="${mock.name}">Name</p>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-0.5 text-xs rounded bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300" th:text="${mock.statusCode}">200</span>
                        <span class="text-sm text-gray-500 ml-2" th:text="${mock.contentType}">application/json</span>
                    </td>
                    <td class="px-6 py-4">
                        <span th:if="${mock.active}" class="text-green-600">Active</span>
                        <span th:unless="${mock.active}" class="text-gray-500">Disabled</span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <form th:action="@{/mocks/{id}/delete(id=${mock.id})}" method="post" class="inline" onsubmit="return confirm('Delete?')">
                            <button class="text-red-500 hover:text-red-700">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal -->
    <div id="mockModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl max-w-lg w-full p-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Create Mock Endpoint</h3>
            <form th:action="@{/mocks/create}" method="post" class="space-y-4">
                <div>
                    <label class="label">Name</label>
                    <input type="text" name="name" class="input" required placeholder="User list mock">
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="label">Method</label>
                        <select name="method" class="input">
                            <option>GET</option>
                            <option>POST</option>
                            <option>PUT</option>
                            <option>DELETE</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="label">Path</label>
                        <input type="text" name="path" class="input" required placeholder="/mock/users">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="label">Status Code</label>
                        <input type="number" name="statusCode" class="input" value="200">
                    </div>
                    <div>
                        <label class="label">Content Type</label>
                        <select name="contentType" class="input">
                            <option>application/json</option>
                            <option>text/plain</option>
                            <option>text/html</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="label">Response Body</label>
                    <textarea name="responseBody" class="input font-mono text-sm" rows="6" placeholder='{"users": []}'></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="document.getElementById('mockModal').classList.add('hidden')" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>
</th:block>
</html>
