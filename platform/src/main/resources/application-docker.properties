# Docker profile configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/nawala}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nawala}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nawala}

# Redis
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.root=INFO
logging.level.id.nawala=INFO

# Encryption key (AES-256, 32 bytes base64-encoded)
nawala.encryption.key=${NAWALA_ENCRYPTION_KEY:ieUfr//mm5I3ZRW39jagiPW9KG8SOiPgvQZULD00LW4=}
