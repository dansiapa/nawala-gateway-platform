<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Documentation - Nawala</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-page">
    <div th:replace="~{fragments/sidebar :: sidebar('docs')}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/header :: header('API Documentation', 'Auto-generated documentation for your APIs')}"></div>
        <div class="content-area">
            <div th:if="${success}" class="alert alert-success"><span th:text="${success}"></span></div>
            
            <!-- Quick Actions -->
            <div style="display:flex;gap:1rem;margin-bottom:1.5rem">
                <form th:action="@{/docs/generate}" method="post">
                    <button type="submit" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Regenerate Docs
                    </button>
                </form>
                <a th:href="@{/docs/public}" target="_blank" class="btn btn-outline">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    View Public Docs
                </a>
            </div>

            <!-- API Groups -->
            <div class="docs-container">
                <div class="docs-sidebar">
                    <h4>API Groups</h4>
                    <ul class="docs-nav">
                        <li th:each="group : ${apiGroups}">
                            <a th:href="'#' + ${group.name}" th:text="${group.name}">Group</a>
                            <span class="badge badge-sm" th:text="${group.endpointCount}">0</span>
                        </li>
                        <li th:if="${#lists.isEmpty(apiGroups)}" class="text-muted">No APIs documented yet</li>
                    </ul>
                </div>
                <div class="docs-content">
                    <div th:each="group : ${apiGroups}" class="docs-group" th:id="${group.name}">
                        <h3 th:text="${group.name}">API Group</h3>
                        <p th:text="${group.description}">Description</p>
                        
                        <div class="endpoint-cards">
                            <div th:each="endpoint : ${group.endpoints}" class="endpoint-card">
                                <div class="endpoint-header">
                                    <span class="method-badge" th:classappend="' method-' + ${endpoint.method.toLowerCase()}" th:text="${endpoint.method}">GET</span>
                                    <code class="endpoint-path" th:text="${endpoint.path}">/api/endpoint</code>
                                </div>
                                <p class="endpoint-desc" th:text="${endpoint.description}">Endpoint description</p>
                                <div class="endpoint-meta">
                                    <span th:if="${endpoint.authRequired}" class="tag tag-sm">🔒 Auth Required</span>
                                    <span th:if="${endpoint.rateLimited}" class="tag tag-sm">⏱ Rate Limited</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div th:if="${#lists.isEmpty(apiGroups)}" class="empty-state" style="padding:3rem">
                        <p>No API documentation generated yet.</p>
                        <p class="text-muted">Click "Regenerate Docs" to generate documentation from your routes.</p>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
