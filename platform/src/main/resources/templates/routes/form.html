<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: layout(title=${routeId != null} ? 'Edit Route' : 'New Route', content=~{::content})}">
<div th:fragment="content">
    <div class="max-w-4xl">
        <!-- Back Link -->
        <a th:href="@{/routes}" class="inline-flex items-center gap-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 mb-6">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Back to Routes
        </a>

        <form th:action="${routeId != null} ? @{/routes/{id}/edit(id=${routeId})} : @{/routes/new}" method="post" th:object="${form}" class="space-y-6">
            <!-- Basic Info -->
            <div class="card p-6">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Basic Information</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="label">Route Name *</label>
                        <input type="text" th:field="*{name}" class="input" placeholder="User API" required>
                        <p th:if="${#fields.hasErrors('name')}" class="mt-1 text-sm text-red-500" th:errors="*{name}"></p>
                    </div>
                    <div>
                        <label class="label">HTTP Method *</label>
                        <select th:field="*{method}" class="input" required>
                            <option value="GET">GET</option>
                            <option value="POST">POST</option>
                            <option value="PUT">PUT</option>
                            <option value="PATCH">PATCH</option>
                            <option value="DELETE">DELETE</option>
                            <option value="OPTIONS">OPTIONS</option>
                            <option value="HEAD">HEAD</option>
                        </select>
                    </div>
                    <div>
                        <label class="label">Path *</label>
                        <input type="text" th:field="*{path}" class="input font-mono" placeholder="/api/users/{id}" required>
                        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Use {param} for path variables</p>
                    </div>
                    <div class="md:col-span-2">
                        <label class="label">Description</label>
                        <textarea th:field="*{description}" class="input" rows="2" placeholder="What does this route do?"></textarea>
                    </div>
                </div>
            </div>

            <!-- Target Configuration -->
            <div class="card p-6">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Target Configuration</h2>
                <div class="space-y-4">
                    <div>
                        <label class="label">Primary Target URL *</label>
                        <input type="url" th:field="*{targetUrl}" class="input font-mono" placeholder="https://backend.example.com/api/users" required>
                    </div>
                    <div>
                        <label class="label">Health Check URL</label>
                        <input type="url" th:field="*{healthCheckUrl}" class="input font-mono" placeholder="https://backend.example.com/health">
                    </div>
                    
                    <!-- Load Balancer Toggle -->
                    <div class="pt-4 border-t border-gray-200 dark:border-gray-700">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" th:field="*{loadBalanced}" class="w-5 h-5 rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500" id="loadBalancedToggle">
                            <div>
                                <span class="font-medium text-gray-900 dark:text-white">Enable Load Balancing</span>
                                <p class="text-sm text-gray-500 dark:text-gray-400">Distribute traffic across multiple backend servers</p>
                            </div>
                        </label>
                    </div>
                    
                    <!-- Load Balancer Options -->
                    <div id="lbOptions" class="space-y-4 pl-8 border-l-2 border-blue-200 dark:border-blue-800" style="display: none;">
                        <div>
                            <label class="label">Strategy</label>
                            <select th:field="*{loadBalancerStrategy}" class="input">
                                <option th:each="s : ${strategies}" th:value="${s}" th:text="${s.displayName}">Round Robin</option>
                            </select>
                        </div>
                        
                        <!-- Existing Targets -->
                        <div th:if="${targets != null and !targets.isEmpty()}">
                            <label class="label">Backend Targets</label>
                            <div class="space-y-2">
                                <div th:each="target : ${targets}" class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                                    <span th:classappend="${target.healthy} ? 'bg-green-500' : 'bg-red-500'" class="w-2 h-2 rounded-full"></span>
                                    <span class="flex-1 font-mono text-sm text-gray-700 dark:text-gray-300" th:text="${target.url}">url</span>
                                    <span class="text-sm text-gray-500 dark:text-gray-400">Weight: <span th:text="${target.weight}">50</span></span>
                                    <form th:action="@{/routes/{rid}/targets/{tid}/remove(rid=${routeId}, tid=${target.id})}" method="post" class="inline">
                                        <button type="submit" class="text-red-500 hover:text-red-700">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Security & Features -->
            <div class="card p-6">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Security & Features</h2>
                <div class="space-y-4">
                    <label class="flex items-center gap-3 p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg cursor-pointer">
                        <input type="checkbox" th:field="*{authRequired}" class="w-5 h-5 rounded border-gray-300 dark:border-gray-600 text-blue-600">
                        <div>
                            <span class="font-medium text-gray-900 dark:text-white">Require Authentication</span>
                            <p class="text-sm text-gray-500 dark:text-gray-400">API key or OAuth token required</p>
                        </div>
                    </label>
                    
                    <label class="flex items-center gap-3 p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg cursor-pointer">
                        <input type="checkbox" th:field="*{rateLimitEnabled}" class="w-5 h-5 rounded border-gray-300 dark:border-gray-600 text-blue-600" id="rateLimitToggle">
                        <div class="flex-1">
                            <span class="font-medium text-gray-900 dark:text-white">Enable Rate Limiting</span>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Limit requests per minute</p>
                        </div>
                        <input type="number" th:field="*{rateLimitPerMinute}" class="w-24 input text-center" placeholder="60" min="1">
                        <span class="text-sm text-gray-500 dark:text-gray-400">/min</span>
                    </label>
                    
                    <label class="flex items-center gap-3 p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg cursor-pointer">
                        <input type="checkbox" th:field="*{payloadEncryption}" class="w-5 h-5 rounded border-gray-300 dark:border-gray-600 text-blue-600">
                        <div>
                            <span class="font-medium text-gray-900 dark:text-white">Payload Encryption</span>
                            <p class="text-sm text-gray-500 dark:text-gray-400">End-to-end encryption for sensitive data</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-end gap-4">
                <a th:href="@{/routes}" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">
                    <span th:text="${routeId != null} ? 'Update Route' : 'Create Route'">Save</span>
                </button>
            </div>
        </form>
    </div>

    <script>
        // Toggle load balancer options
        const lbToggle = document.getElementById('loadBalancedToggle');
        const lbOptions = document.getElementById('lbOptions');
        function updateLbOptions() {
            lbOptions.style.display = lbToggle.checked ? 'block' : 'none';
        }
        lbToggle.addEventListener('change', updateLbOptions);
        updateLbOptions();
    </script>
</div>
</th:block>
</html>
