<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: layout(title='Generate API Key', content=~{::content})}">
<div th:fragment="content">
    <div class="max-w-2xl">
        <a th:href="@{/apikeys}" class="inline-flex items-center gap-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 mb-6">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Back to API Keys
        </a>

        <div class="card p-6">
            <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-6">Generate New API Key</h2>
            <form th:action="@{/apikeys/new}" method="post" class="space-y-6">
                <div>
                    <label class="label">Key Name *</label>
                    <input type="text" name="name" class="input" placeholder="Production API Key" required>
                    <p class="mt-1 text-xs text-gray-500">A descriptive name for this key</p>
                </div>
                <div>
                    <label class="label">Description</label>
                    <textarea name="description" class="input" rows="2" placeholder="Used by mobile app"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="label">Rate Limit (per minute)</label>
                        <input type="number" name="rateLimit" class="input" value="60" min="0">
                        <p class="mt-1 text-xs text-gray-500">0 for unlimited</p>
                    </div>
                    <div>
                        <label class="label">Expires In</label>
                        <select name="expiresIn" class="input">
                            <option value="">Never</option>
                            <option value="7">7 days</option>
                            <option value="30">30 days</option>
                            <option value="90">90 days</option>
                            <option value="365">1 year</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="label">Allowed Routes (optional)</label>
                    <select name="allowedRoutes" multiple class="input" size="4">
                        <option th:each="route : ${routes}" th:value="${route.id}" th:text="${route.method + ' ' + route.path}">GET /api</option>
                    </select>
                    <p class="mt-1 text-xs text-gray-500">Leave empty to allow all routes</p>
                </div>
                <div class="flex justify-end gap-4 pt-4">
                    <a th:href="@{/apikeys}" class="btn-secondary">Cancel</a>
                    <button type="submit" class="btn-primary">Generate Key</button>
                </div>
            </form>
        </div>
    </div>
</div>
</th:block>
</html>
