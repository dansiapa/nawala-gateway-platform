<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="error-page">
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1 class="error-code">500</h1>
        <h2 class="error-title">Something Went Wrong</h2>
        <p class="error-message">We encountered an unexpected error. Our team has been notified.</p>
        <div class="error-actions">
            <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
            <a href="javascript:location.reload()" class="btn btn-outline">Try Again</a>
        </div>
    </div>
</body>
</html>
